# Coverage uploads to Codecov on every push to main and every PR.
#
# Two uploads, one per Codecov flag:
#   - frontend: vitest writes an lcov report (`vitest run --coverage`).
#   - backend:  the C# suite runs with Microsoft's code-coverage
#     collector. It ships inside Microsoft.NET.Test.Sdk, so there's no
#     extra package, and it works on .NET Framework 4.8 as-is.
#     src/KitsuneCommand.Tests/coverage.runsettings limits it to
#     KitsuneCommand.dll + KitsuneCommand.Abstractions.dll and asks for
#     Cobertura output. No coverage gates yet: this is the baseline.
#
# Tests are also run separately by tests.yml on the same triggers.
# Both workflows exercise the same test runs; the duplication is
# intentional — tests.yml fails fast on a broken build (PR feedback
# loop), coverage.yml has codecov-action's longer warmup. If/when
# tests.yml gets retired, this is the workflow to fold its checks
# into.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch / PR when a new commit lands.
# Cuts the per-push CI minute count roughly in half on a rapid-iteration
# branch + makes the "latest run" link in the codecov badge actually
# reflect the head commit.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Cache npm so `npm ci` reuses the previous run's
          # node_modules tarballs. Saves ~30s on a cold install.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # `npx vitest run --coverage` is the canonical invocation;
        # `npm run test:coverage` in package.json is a thin wrapper
        # around the same thing. Inlining keeps one less indirection
        # the next maintainer has to chase.
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # codecov-action interprets `files:` relative to the repo
          # root (GITHUB_WORKSPACE), not the job's working-directory.
          # vitest writes the report to <cwd>/coverage/lcov.info which
          # is frontend/coverage/lcov.info from the repo root.
          files: ./frontend/coverage/lcov.info
          flags: frontend
          # Upload only the file named above. Without this the uploader
          # also searches the repo for anything named like a coverage
          # report, which picks up src/KitsuneCommand.Tests/coverage.runsettings
          # and attaches it to this flag.
          disable_search: true
          # Token-aware: present for private repos / forks that need
          # an explicit secret; ignored for public-repo tokenless
          # tier. Adding the line costs nothing and unblocks the
          # day someone toggles repo visibility.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fail the workflow when coverage upload errors out so a
          # broken codecov badge doesn't sit green-on-paper while
          # actually surfacing stale data.
          fail_ci_if_error: true
          verbose: true

  backend:
    name: Backend (NUnit)
    # Windows for the same reason as tests.yml's backend-tests: KC targets
    # .NET Framework 4.8, which windows-latest ships.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run tests with coverage
        shell: pwsh
        # The run settings pick the format (Cobertura) and the modules to
        # measure. The collector writes into coverage/<guid>/<machine>.cobertura.xml,
        # so copy it to a fixed path for the upload, and fail loudly if it's missing.
        run: |
          dotnet test src/KitsuneCommand.Tests/KitsuneCommand.Tests.csproj `
            --configuration Release `
            --collect "Code Coverage" `
            --settings src/KitsuneCommand.Tests/coverage.runsettings `
            --results-directory coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-ChildItem coverage -Recurse -Filter *.cobertura.xml | Select-Object -First 1
          if (-not $report) { Write-Error "No Cobertura report was produced."; exit 1 }
          Copy-Item $report.FullName coverage/backend.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/backend.cobertura.xml
          flags: backend
          # Same as the frontend upload: only the file above. The search
          # otherwise also sends coverage.runsettings and the uploader's
          # own codecov.exe.SHA256SUM.sig.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
